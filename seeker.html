<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Saved Homes — InzuLink</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05080f" />
  <meta name="description" content="Your saved properties on InzuLink." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>

  <!-- Shared styles -->
  <link rel="stylesheet" href="./assets/app.css" />
  <link rel="stylesheet" href="./assets/theme.css" />

  <style>
    .page-head{margin-top:16px;padding:24px 26px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .page-head h1{font-family:var(--font-display);font-size:clamp(1.5rem,2.8vw,2rem);letter-spacing:-.6px;color:#fff;margin:8px 0 6px}
    .page-head .sub{color:var(--muted);font-weight:600;margin:0;line-height:1.65}

    .saved-grid{margin-top:18px}
    .prop{cursor:pointer}
    .type-band{
      position:absolute;top:0;left:0;width:100%;z-index:4;
      padding:9px 0;text-align:center;
      font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;
    }
    .bg-rent{background:rgba(5,8,15,.85)}
    .bg-sale{background:rgba(11,60,38,.88)}
    .bg-sold{background:rgba(92,26,42,.9)}
    .bg-shared{background:rgba(8,47,57,.88)}
    .verified-line{display:flex;align-items:center;gap:6px;color:var(--cyan);font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
    .remove-btn{width:100%;justify-content:center;background:#1c0b12;border:1px solid #5c1a2a;color:#fda4b5}
    .remove-btn:hover{background:#2a0f18;border-color:var(--danger);color:#fff}

    .empty-state{margin-top:18px;padding:48px 24px;text-align:center}
    .empty-state i{font-size:3.2rem;color:#1c2947}
    .empty-state h2{font-family:var(--font-display);color:#fff;margin:12px 0 6px}
    .empty-state p{color:var(--muted);margin:0 0 18px}

    /* Detail modal */
    .detail{width:min(1020px,96vw);background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;max-height:92vh;position:relative}
    .detail-close{
      position:absolute;top:12px;right:12px;z-index:30;
      width:40px;height:40px;border-radius:12px;
      background:rgba(5,8,15,.7);border:1px solid var(--line);color:#fff;
      display:grid;place-items:center;font-size:1.1rem;cursor:pointer;
    }
    .detail-close:hover{border-color:var(--danger);color:var(--danger)}
    .Detail-gallery{position:relative;background:#04070d;display:flex;align-items:center;justify-content:center;min-height:340px}
    .Detail-gallery img{width:100%;height:100%;max-height:92vh;object-fit:contain}
    .g-arrow{
      position:absolute;top:50%;transform:translateY(-50%);z-index:20;
      width:44px;height:44px;border-radius:12px;
      background:rgba(5,8,15,.7);border:1px solid var(--line);color:#fff;
      font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
    }
    .g-arrow:hover{border-color:var(--cyan);color:var(--cyan)}
    .g-prev{left:12px}.g-next{right:12px}
    .Detail-info{padding:24px;overflow:auto}
    .Detail-title{margin:10px 0 4px;font-family:var(--font-display);font-size:1.4rem;color:#fff;letter-spacing:-.4px;line-height:1.2}
    .Detail-loc{color:var(--muted);font-weight:600;font-size:.9rem;margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .Detail-loc i{color:var(--cyan)}
    .Detail-price{font-family:var(--font-display);font-size:1.7rem;font-weight:800;color:#fff;margin:0 0 16px;letter-spacing:-.5px}
    .Detail-price small{font-family:var(--font-body);font-size:.85rem;font-weight:700;color:var(--faint)}
    .specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
    .spec-box{border:1px solid var(--line-soft);border-radius:14px;padding:11px 13px;background:var(--bg1)}
    .spec-label{display:block;color:var(--faint);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
    .spec-value{display:block;color:#fff;font-weight:800;margin-top:4px;font-size:.93rem}
    .Detail-desc{color:var(--muted);line-height:1.7;font-size:.92rem}
    .Detail-desc strong{display:block;color:#fff;margin-bottom:6px;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
    .wa-btn{width:100%;margin-top:18px;justify-content:center;background:#16a34a;color:#fff}
    .wa-btn:hover{background:#22c55e;color:#04120a}

    .mini-foot{margin:26px 0;text-align:center;color:var(--faint);font-size:.85rem;font-weight:600}
    .mini-foot a{color:var(--cyan);font-weight:800}

    @media (max-width:980px){
      .Detail{grid-template-columns:1fr;max-height:94vh}
      .Detail-gallery{min-height:260px}
      .Detail-gallery img{max-height:44vh}
    }
  </style>

  <script>
    // Guard (must be logged in)
    (function(){
      let u = null;
      try { u = JSON.parse(localStorage.getItem("user")); } catch(_) {}
      if (!u) window.location.replace("login.html?next=seeker.html");
    })();
  </script>
</head>

<body>
  <!-- Shared navbar -->
  <div id="appNavbar"></div>

  <main class="wrap">
    <section class="panel page-head" aria-label="Saved homes header">
      <div>
        <span class="kicker">Wishlist</span>
        <h1>My saved homes</h1>
        <p class="sub">Properties you bookmarked for later. Click a card to view details.</p>
      </div>
      <div class="row">
        <a class="btn btn-dark btn-sm" href="feed.html"><i class="ph ph-globe"></i> Marketplace</a>
        <button class="btn btn-line btn-sm" type="button" onclick="loadFavorites(true)">
          <i class="ph ph-arrows-clockwise"></i> Refresh
        </button>
      </div>
    </section>

    <section id="contentArea">
      <div class="prop-grid saved-grid">
        <div class="skel" style="height:300px"></div>
        <div class="skel" style="height:300px"></div>
        <div class="skel" style="height:300px"></div>
      </div>
    </section>

    <div class="mini-foot">© 2026 InzuLink · <a href="contract.html">Contract tool</a></div>
  </main>

  <!-- Detail modal -->
  <div class="overlay" id="detailOverlay" aria-hidden="true">
    <div class="detail" role="dialog" aria-label="Property details">
      <button class="detail-close" onclick="closeModal()" aria-label="Close">✕</button>

      <div class="Detail-gallery">
        <button class="g-arrow g-prev" id="btnPrev" onclick="moveImg(-1)">&#10094;</button>
        <img id="mainImg" alt="Property image" />
        <button class="g-arrow g-next" id="btnNext" onclick="moveImg(1)">&#10095;</button>
      </div>

      <div class="Detail-info">
        <span id="mType" class="chip chip-rent">Rent</span>
        <h2 class="Detail-title" id="mTitle">Title</h2>
        <div class="Detail-loc" id="mLoc"><i class="ph ph-map-pin"></i> Location</div>
        <p class="Detail-price" id="mPrice">RWF 0</p>

        <div class="specs-grid">
          <div class="spec-box"><span class="spec-label">Category</span><span class="spec-value" id="mCat">-</span></div>
          <div class="spec-box"><span class="spec-label" id="mDynLabel">Bedrooms</span><span class="spec-value" id="mDynValue">-</span></div>
        </div>

        <div class="Detail-desc">
          <strong>Description</strong>
          <span id="mDesc">—</span>
        </div>

        <button class="btn wa-btn" id="mCta">
          <i class="ph ph-whatsapp-logo"></i> Chat on WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- Shared navbar script -->
  <script src="./assets/navbar.js"></script>

  <script>
    const API_BASE = (localStorage.getItem("API_BASE") || "https://inzulink-v1.onrender.com").replace(/\/$/, "");
    const FALLBACK_IMG = "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?q=80&w=800&auto=format&fit=crop";

    let user = null;
    try { user = JSON.parse(localStorage.getItem("user")); } catch(_) {}

    const contentArea = document.getElementById("contentArea");

    // Modal state
    let modalHouse = null;
    let modalImages = [];
    let modalIndex = 0;

    function money(v){
      const n = Number(v || 0);
      if (!Number.isFinite(n)) return "RWF 0";
      return "RWF " + n.toLocaleString("en-RW");
    }
    function esc(v){
      return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function imgFor(h, i){
      const list = (h.images && Array.isArray(h.images)) ? h.images : [];
      const raw = list[i || 0];
      if (!raw) return FALLBACK_IMG;
      const s = String(raw).replace(/\\/g, "/");
      if (/^https?:\/\//i.test(s)) return s;
      return `${API_BASE}/${s.replace(/^\//, "")}`;
    }

    function normalizeType(t){
      const x = (t || "").toLowerCase();
      if (x.includes("rent")) return "Rent";
      if (x.includes("sale")) return "Sale";
      if (x.includes("shared") || x.includes("room")) return "Shared";
      if (x.includes("sold")) return "Sold";
      return t || "Rent";
    }
    function typeBadgeClass(type){
      const t = normalizeType(type);
      if (t === "Sale") return "bg-sale";
      if (t === "Shared") return "bg-shared";
      if (t === "Sold") return "bg-sold";
      return "bg-rent";
    }
    function typeChip(type){
      const t = normalizeType(type);
      if (t === "Sale") return "chip-sale";
      if (t === "Shared") return "chip-live";
      if (t === "Sold") return "chip-warn";
      return "chip-rent";
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 12000){
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try { return await fetch(url, { ...options, signal: controller.signal }); }
      finally { clearTimeout(id); }
    }

    function renderEmpty(){
      contentArea.innerHTML = `
        <div class="panel empty-state">
          <i class="ph ph-heart-break"></i>
          <h2>No favorites yet</h2>
          <p>Browse the marketplace and tap the heart icon to save homes here.</p>
          <a class="btn btn-solid" href="feed.html"><i class="ph ph-globe"></i> Browse properties</a>
        </div>
      `;
    }

    function buildCards(list){
      contentArea.innerHTML = `
        <div class="feed-head spread" style="margin:20px 0 14px">
          <h2 style="font-family:var(--font-display);font-size:1.2rem;color:#fff;margin:0">${list.length} saved propert${list.length === 1 ? "y" : "ies"}</h2>
        </div>
        <div class="prop-grid" id="grid"></div>
      `;
      const grid = document.getElementById("grid");

      list.forEach(h => {
        const id = Number(h.property_id ?? h.id ?? h.propertyId);
        const title = h.title || "Property";
        const location = h.location || [h.sector, h.district].filter(Boolean).join(", ") || "Rwanda";
        const category = h.category || "-";
        const type = normalizeType(h.listing_type || h.type || h.status || "Rent");
        const isVerified = !!(h.is_verified || h.is_verified_agent);
        const price = money(h.price_per_month ?? h.price ?? 0);
        const isRent = type === "Rent";
        const beds = h.bedrooms ?? h.beds;

        const card = document.createElement("article");
        card.className = "prop";
        card.onclick = () => openModal(h);

        card.innerHTML = `
          <div class="prop-media">
            <div class="type-band ${typeBadgeClass(type)}">${esc(type)}</div>
            <img src="${esc(imgFor(h))}" alt="${esc(title)}" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'" />
          </div>
          <div class="prop-body">
            ${isVerified ? `<div class="verified-line"><i class="ph ph-seal-check"></i> Verified seller</div>` : ``}
            <div class="prop-price">${esc(price)}${isRent ? " <small>/month</small>" : ""}</div>
            <h3 class="prop-title">${esc(title)}</h3>
            <div class="prop-meta">
              <span><i class="ph ph-map-pin"></i>${esc(location)}</span>
              ${beds !== null && beds !== undefined && beds !== "" ? `<span><i class="ph ph-bed"></i>${esc(beds)} bd</span>` : ""}
              <span><i class="ph ph-tag"></i>${esc(category)}</span>
            </div>
            <div class="prop-foot">
              <button class="btn btn-sm remove-btn" onclick="event.stopPropagation(); removeFav(${id});">
                <i class="ph ph-trash"></i> Remove
              </button>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    async function loadFavorites(force=false){
      if (!user) return window.location.replace("login.html?next=seeker.html");

      contentArea.innerHTML = `
        <div class="prop-grid saved-grid">
          <div class="skel" style="height:300px"></div>
          <div class="skel" style="height:300px"></div>
          <div class="skel" style="height:300px"></div>
        </div>`;

      try{
        const res = await fetchWithTimeout(`${API_BASE}/api/favorites/${user.id}`, {}, 15000);
        const data = await res.json().catch(() => []);
        if (!res.ok) throw new Error(data?.error || "Failed to load");

        const list = Array.isArray(data) ? data : [];
        if (list.length === 0) return renderEmpty();

        buildCards(list);

      } catch(err){
        contentArea.innerHTML = `
          <div class="panel empty-state" style="border-color:#5c1a2a">
            <i class="ph ph-warning-circle" style="color:#5c1a2a"></i>
            <h2>Could not load favorites</h2>
            <p>Check your server or API_BASE setting, then try again.</p>
            <div class="row" style="justify-content:center">
              <button class="btn btn-solid btn-sm" onclick="loadFavorites(true)"><i class="ph ph-arrows-clockwise"></i> Retry</button>
              <a class="btn btn-line btn-sm" href="feed.html"><i class="ph ph-globe"></i> Marketplace</a>
            </div>
          </div>
        `;
      }
    }

    async function removeFav(propertyId){
      if (!user) return window.location.replace("login.html?next=seeker.html");
      if (!confirm("Remove this property from your saved list?")) return;

      try{
        const res = await fetchWithTimeout(`${API_BASE}/api/favorites`, {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({ userId: user.id, propertyId: Number(propertyId) })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.error || "Failed");

        loadFavorites(true);
      } catch(_) {
        alert("Could not remove right now. Please try again.");
      }
    }

    function openModal(h){
      modalHouse = h;

      const type = normalizeType(h.listing_type || h.type || h.status || "Rent");
      const category = h.category || "-";
      const title = h.title || "Property";
      const location = h.location || [h.sector, h.district].filter(Boolean).join(", ") || "Rwanda";
      const isRent = type === "Rent";

      modalImages = (h.images && Array.isArray(h.images) && h.images.length)
        ? h.images.map((_, i) => imgFor(h, i))
        : [FALLBACK_IMG];
      modalIndex = 0;

      const mType = document.getElementById("mType");
      mType.textContent = type;
      mType.className = `chip ${typeChip(type)}`;

      document.getElementById("mTitle").textContent = title;
      document.getElementById("mLoc").innerHTML = `<i class="ph ph-map-pin"></i> ${esc(location)}`;
      document.getElementById("mPrice").innerHTML = `${money(h.price_per_month ?? h.price ?? 0)}${isRent ? " <small>/month</small>" : ""}`;
      document.getElementById("mCat").textContent = category;
      document.getElementById("mDesc").textContent = h.description || "No description provided.";

      const isLand = (category || "").toLowerCase() === "land";
      document.getElementById("mDynLabel").textContent = isLand ? "UPI" : (type === "Shared" ? "Rooms" : "Bedrooms");
      document.getElementById("mDynValue").textContent = isLand
        ? (h.upi || h.UPI || h.land_upi || "—")
        : (type === "Shared" ? (h.rooms ?? "—") : (h.bedrooms ?? h.beds ?? "—"));

      // WhatsApp CTA
      const btn = document.getElementById("mCta");
      btn.onclick = () => {
        let phone = String(h.contact_phone || h.phone || "").replace(/[^\d]/g, "");
        if (!phone) return alert("Phone number is not available for this listing.");
        if (phone.length === 10 && phone.startsWith("07")) phone = "250" + phone.substring(1);

        const text = encodeURIComponent(`Hello! I'm interested in this property on InzuLink: "${title}".`);
        window.open(`https://wa.me/${phone}?text=${text}`, "_blank");
      };

      setModalImage();
      document.getElementById("detailOverlay").style.display = "flex";
      document.getElementById("detailOverlay").setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function setModalImage(){
      const img = document.getElementById("mainImg");
      img.src = modalImages[modalIndex] || modalImages[0];
      document.getElementById("btnPrev").style.display = (modalImages.length > 1) ? "flex" : "none";
      document.getElementById("btnNext").style.display = (modalImages.length > 1) ? "flex" : "none";
    }

    function moveImg(step){
      if (modalImages.length <= 1) return;
      modalIndex = (modalIndex + step + modalImages.length) % modalImages.length;
      setModalImage();
    }

    function closeModal(){
      document.getElementById("detailOverlay").style.display = "none";
      document.getElementById("detailOverlay").setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    document.getElementById("detailOverlay").addEventListener("click", (e) => {
      if (e.target.id === "detailOverlay") closeModal();
    });
    document.addEventListener("keydown", (e) => {
      const open = document.getElementById("detailOverlay").style.display === "flex";
      if (e.key === "Escape") closeModal();
      if (open && e.key === "ArrowLeft") moveImg(-1);
      if (open && e.key === "ArrowRight") moveImg(1);
    });

    // Init
    window.addEventListener("load", () => loadFavorites());
  </script>
</body>
</html>
