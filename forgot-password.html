<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05080f" />
  <title>Forgot Password — InzuLink</title>

  <meta name="description" content="Request a password reset link for your InzuLink account." />
  <meta name="robots" content="noindex,follow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>

  <link rel="stylesheet" href="./assets/app.css" />
  <link rel="stylesheet" href="./assets/theme.css" />

  <style>
    .auth-shell{max-width:560px;margin:26px auto 30px;padding:32px 30px}
    .auth-shell h1{font-family:var(--font-display);font-size:1.9rem;letter-spacing:-.7px;color:#fff;margin:12px 0 6px}
    .auth-shell .sub{color:var(--muted);line-height:1.65;margin:0 0 20px;font-size:.95rem}
    .msg{display:none;border-radius:14px;padding:12px 14px;font-weight:700;font-size:.9rem;line-height:1.55;border:1px solid var(--line);margin-bottom:14px}
    .msg.err{display:block;background:#33101a;border-color:#5c1a2a;color:#fda4b5}
    .msg.ok{display:block;background:#0a2a1c;border-color:#14532d;color:#6ee7b7}
    .msg.warn{display:block;background:#2c2107;border-color:#574410;color:#fcd34d}
    .hint{color:var(--faint);font-weight:600;font-size:.85rem;line-height:1.6;margin-top:10px}
    .stack{display:grid;gap:10px;margin-top:16px}
    .mini-foot{margin:0 0 26px;text-align:center;color:var(--faint);font-size:.85rem;font-weight:600}
  </style>
</head>

<body>
  <div id="appNavbar"></div>

  <main class="wrap">
    <section class="panel auth-shell" aria-label="Forgot password">
      <span class="kicker">Password reset</span>
      <h1>Forgot your password?</h1>
      <p class="sub">Enter your account email and we'll send you a reset link.</p>

      <div id="msg" class="msg" role="alert"></div>

      <form id="fpForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </div>

        <div class="hint">If you don't receive a link within a few minutes, check your spam folder.</div>

        <div class="stack">
          <button class="btn btn-solid btn-block" id="btnSend" type="submit">
            <i class="ph ph-paper-plane-tilt"></i> Send reset link
          </button>
          <button class="btn btn-line btn-block" type="button" onclick="window.location.href='login.html'">
            <i class="ph ph-sign-in"></i> Back to login
          </button>
        </div>
      </form>
    </section>
    <div class="mini-foot">© 2026 InzuLink · Kigali, Rwanda</div>
  </main>

  <script src="./assets/navbar.js"></script>
  <script>
    const API_BASE = (localStorage.getItem("API_BASE") || "https://inzulink-00l5.onrender.com").replace(/\/$/, "");
    const msg = document.getElementById("msg");
    const btnSend = document.getElementById("btnSend");
    const form = document.getElementById("fpForm");

    function setMsg(type, text){ msg.className = "msg " + type; msg.textContent = text; }
    function clearMsg(){ msg.className = "msg"; msg.textContent = ""; }
    function normalizeEmail(v){ return (v || "").trim().toLowerCase(); }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 12000){
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try { return await fetch(url, { ...options, signal: controller.signal }); }
      finally { clearTimeout(id); }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();

      const email = normalizeEmail(document.getElementById("email").value);
      if (!email || !email.includes("@")) return setMsg("err", "Please enter a valid email address.");

      btnSend.disabled = true;
      btnSend.innerHTML = `<i class="ph ph-circle-notch"></i> Sending…`;

      try{
        const res = await fetchWithTimeout(`${API_BASE}/api/auth/forgot-password`, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ email })
        });

        let data = {};
        try { data = await res.json(); } catch(_) {}

        if (!res.ok){
          setMsg("err", data.error || "Could not send reset link. Please try again.");
          btnSend.disabled = false;
          btnSend.innerHTML = `<i class="ph ph-paper-plane-tilt"></i> Send reset link`;
          return;
        }

        setMsg("ok", data.message || "If the email exists, a reset link has been sent.");
        btnSend.disabled = false;
        btnSend.innerHTML = `<i class="ph ph-paper-plane-tilt"></i> Send reset link`;

      } catch(err){
        setMsg("warn", "Cannot reach server right now. Please try again.");
        btnSend.disabled = false;
        btnSend.innerHTML = `<i class="ph ph-paper-plane-tilt"></i> Send reset link`;
      }
    });
  </script>
</body>
</html>
