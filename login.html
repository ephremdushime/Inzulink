<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05080f" />
  <title>Log In — InzuLink</title>

  <meta name="description" content="Log in to InzuLink to manage listings, save homes, and access your dashboard." />
  <meta name="robots" content="index,follow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>

  <link rel="stylesheet" href="./assets/app.css" />
  <link rel="stylesheet" href="./assets/theme.css" />

  <style>
    .auth-shell{max-width:560px;margin:26px auto 30px;padding:32px 30px}
    .auth-shell h1{font-family:var(--font-display);font-size:2rem;letter-spacing:-.7px;color:#fff;margin:12px 0 6px}
    .auth-shell .sub{color:var(--muted);line-height:1.65;margin:0 0 20px;font-size:.95rem}
    .msg{display:none;border-radius:14px;padding:12px 14px;font-weight:700;font-size:.9rem;line-height:1.55;border:1px solid var(--line);margin-bottom:14px}
    .msg.err{display:block;background:#33101a;border-color:#5c1a2a;color:#fda4b5}
    .msg.ok{display:block;background:#0a2a1c;border-color:#14532d;color:#6ee7b7}
    .msg.warn{display:block;background:#2c2107;border-color:#574410;color:#fcd34d}
    .auth-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 4px}
    .check{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:.88rem;cursor:pointer}
    .check input{width:17px;height:17px;accent-color:#2fd8ff}
    .link{color:var(--cyan);font-weight:800;text-decoration:none;font-size:.88rem}
    .link:hover{text-decoration:underline}
    .stack{display:grid;gap:10px;margin-top:14px}
    .demo-hint{margin-top:18px;color:var(--faint);font-size:.82rem;font-weight:600;line-height:1.7}
    .demo-hint code{display:inline-block;margin-top:6px;background:#0a1120;border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--muted);font-size:.78rem;word-break:break-all}
    .mini-foot{margin:0 0 26px;text-align:center;color:var(--faint);font-size:.85rem;font-weight:600}
  </style>

  <script>
    (function () {
      let u = null;
      try { u = JSON.parse(localStorage.getItem("user")); } catch(_) {}
      if (!u) return;
      let dest = "feed.html";
      if (u.role === "Admin") dest = "dashboard.html";
      else if (u.role === "Landlord") dest = "landlord.html";
      else if (u.role === "Seeker") dest = "seeker.html";
      window.location.replace(dest);
    })();
  </script>
</head>

<body>
  <div id="appNavbar"></div>

  <main class="wrap">
    <section class="panel auth-shell" aria-label="Login form">
      <span class="kicker">Secure login</span>
      <h1>Welcome back</h1>
      <p class="sub">Log in to manage listings, save homes, and open your dashboard.</p>

      <div id="msg" class="msg" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" autocomplete="current-password" placeholder="Your password" required />
        </div>

        <div class="auth-row">
          <label class="check">
            <input type="checkbox" id="rememberMe" />
            Remember email
          </label>
          <a class="link" href="forgot-password.html">Forgot password?</a>
        </div>

        <div class="stack">
          <button class="btn btn-solid btn-block" id="btnLogin" type="submit">
            <i class="ph ph-sign-in"></i> Log in
          </button>
          <button class="btn btn-line btn-block" type="button" onclick="window.location.href='signup.html'">
            <i class="ph ph-user-plus"></i> Create an account
          </button>
        </div>

        <div class="demo-hint">
          Demo tip — point the app at your backend once:
          <br />
          <code>localStorage.setItem("API_BASE","https://YOUR-BACKEND.onrender.com")</code>
        </div>
      </form>
    </section>
    <div class="mini-foot">© 2026 InzuLink · Kigali, Rwanda</div>
  </main>

  <script src="./assets/navbar.js"></script>
  <script>
    const API_BASE = (localStorage.getItem("API_BASE") || "https://inzulink-v1.onrender.com").replace(/\/$/, "");
    const msg = document.getElementById("msg");
    const btnLogin = document.getElementById("btnLogin");
    const form = document.getElementById("loginForm");

    const savedEmail = localStorage.getItem("remember_email");
    if (savedEmail) {
      document.getElementById("email").value = savedEmail;
      document.getElementById("rememberMe").checked = true;
    }

    function setMsg(type, text){ msg.className = "msg " + type; msg.textContent = text; }
    function clearMsg(){ msg.className = "msg"; msg.textContent = ""; }
    function normalizeEmail(v){ return (v || "").trim().toLowerCase(); }

    function redirectByRole(user){
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");
      if (next && /^[a-z0-9\-_.\/]+$/i.test(next)) return window.location.replace(next);

      let dest = "feed.html";
      if (user.role === "Admin") dest = "dashboard.html";
      else if (user.role === "Landlord") dest = "landlord.html";
      else if (user.role === "Seeker") dest = "seeker.html";
      window.location.replace(dest);
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 9000){
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try { return await fetch(url, { ...options, signal: controller.signal }); }
      finally { clearTimeout(id); }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();

      const email = normalizeEmail(document.getElementById("email").value);
      const password = (document.getElementById("password").value || "").trim();
      const remember = document.getElementById("rememberMe").checked;

      if (!email || !email.includes("@")) return setMsg("err", "Please enter a valid email.");
      if (!password) return setMsg("err", "Please enter your password.");

      if (remember) localStorage.setItem("remember_email", email);
      else localStorage.removeItem("remember_email");

      btnLogin.disabled = true;
      btnLogin.innerHTML = `<i class="ph ph-circle-notch"></i> Logging in…`;

      try {
        const res = await fetchWithTimeout(`${API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        let data = {};
        try { data = await res.json(); } catch(_) {}

        if (!res.ok) {
          setMsg("err", data.error || "Login failed. Please check your credentials.");
          btnLogin.disabled = false;
          btnLogin.innerHTML = `<i class="ph ph-sign-in"></i> Log in`;
          return;
        }

        localStorage.setItem("user", JSON.stringify(data.user));
        setMsg("ok", "Login successful. Redirecting…");
        setTimeout(() => redirectByRole(data.user), 450);

      } catch (err) {
        setMsg("warn", "Cannot reach the server right now. Please try again.");
        btnLogin.disabled = false;
        btnLogin.innerHTML = `<i class="ph ph-sign-in"></i> Log in`;
      }
    });
  </script>
</body>
</html>
